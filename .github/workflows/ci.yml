name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Type stripping is on by default from 22.18, which is what lets the
          # unit tests import lib/*.ts without a build step or a loader.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Split out from the build so a logic regression fails in seconds rather
      # than after a full Next build.
      - run: npm run test:unit

      - run: npm run build

      - run: npm run test:smoke
